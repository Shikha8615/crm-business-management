<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRM & Business Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8fa;
            color: #24292f;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            padding: 40px 50px;
        }

        h1 {
            font-size: 36px;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 15px;
        }

        h2 {
            margin-top: 35px;
            border-bottom: 1px solid #d8dee4;
            padding-bottom: 8px;
        }

        h3 {
            margin-top: 25px;
        }

        p {
            line-height: 1.7;
        }

        ul, ol {
            line-height: 1.8;
        }

        pre {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
        }

        code {
            font-family: Consolas, "Courier New", monospace;
        }

        :not(pre) > code {
            background: #f0f2f4;
            padding: 3px 6px;
            border-radius: 4px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #d0d7de;
            padding: 8px 12px;
            text-align: left;
        }

        blockquote {
            border-left: 4px solid #d0d7de;
            padding-left: 16px;
            color: #57606a;
        }

        a {
            color: #0969da;
        }

        @media (max-width: 700px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container" id="readme">
    Loading README...
</div>

<script type="module">

    import { marked } from "./node_modules/marked/lib/marked.esm.js";

    fetch("./README.md")
        .then(response => {
            if (!response.ok) {
                throw new Error("README.md could not be loaded.");
            }

            return response.text();
        })
        .then(markdown => {

            document.getElementById("readme").innerHTML =
                marked.parse(markdown);

        })
        .catch(error => {

            document.getElementById("readme").innerHTML = `
                <h2>Unable to load README</h2>
                <p>${error.message}</p>
            `;

        });

</script>

</body>
</html>
